version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: go-postgres
    environment:
      POSTGRES_USER: go-boilerplate
      POSTGRES_PASSWORD: go-boilerplate
      POSTGRES_DB: go-boilerplate-db
    ports:
      - "5445:5432"
    volumes:
      - go_postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:alpine
    container_name: go-boilerplate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"


volumes:
  go_postgres_data: